[project]
name = "rgraph-mcp"
version = "0.1.0"
description = "RNAseq 下游可视化/分析 MCP 服务：把一套 R (ggplot2/pheatmap/clusterProfiler/WGCNA...) 出图脚本参数化封装为 MCP 工具，由 Rscript 引擎渲染"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
rgraph-cli = "rgraph_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rgraph_toolkit"]

[tool.hatch.build.targets.wheel.force-include]
"rscripts" = "rgraph_toolkit/rscripts"
